spring:
  application:
    name: movie
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/umc_movie?characterEncoding=UTF-8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  cors:
    enabled: ${CORS_ENABLED:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
