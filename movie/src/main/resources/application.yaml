spring:
  datasource:
    url: ${DB_URL}
    username: root
    password: ${DB_PW}
  jackson:
    deserialization:
      accept-float-as-int: false # 4.5 같은 소수 별점을 4로 자르지 않고 거절합니다.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  jwt:
    secret: ${JWT_SECRET} # 서명에 쓸 비밀키. 코드에 직접 쓰지 않습니다
    access-expiration: ${JWT_ACCESS_EXPIRATION} # 토큰 유효시간(초)