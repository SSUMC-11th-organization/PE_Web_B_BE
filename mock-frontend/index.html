<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>mock-frontend</title>
<link rel="icon" href="data:,">  <!-- favicon.ico 404 방지 -->

<body style="font-family: sans-serif; max-width: 560px; margin: 40px auto">
  <p>서버
    <select id="base">
      <option value="http://localhost:8080">Spring :8080</option>
      <option value="http://localhost:3000">NestJS :3000</option>
    </select>
  </p>
  <p><input id="nickname" value="수현">
     <button onclick="call('/members/nickname/' + v('nickname'))">닉네임 중복 체크</button></p>
  <p><input id="email" value="noco@umc.com">
     <button onclick="call('/members/email/' + v('email'))">이메일 중복 체크</button></p>
  <p><input id="memberId" value="1">
     <button onclick="call('/members/' + v('memberId') + '/ratings')">평점 조회</button></p>
  <pre id="out" style="background:#f4f4f4; padding:12px"></pre>

  <script>
    const $ = (id) => document.getElementById(id);
    // 한글·특수문자를 URL에 안전하게 넣기 위해 인코딩
    const v = (id) => encodeURIComponent($(id).value.trim());

    async function call(path) {
      const url = $('base').value + path;
      $('out').textContent = `GET ${url}\n요청 중…`;
      try {
        const res = await fetch(url);
        const text = await res.text();
        let body = text;
        try { body = JSON.stringify(JSON.parse(text), null, 2); } catch {}
        $('out').textContent = `GET ${url}\n${res.status}\n\n${body}`;
      } catch (e) {
        $('out').textContent = `GET ${url}\n요청 실패: ${e.message}\n→ Console 탭에서 CORS 에러인지 확인하세요.`;
      }
    }
  </script>
</body>
</html>
